name: ci

# DELIBERATELY no `paths:` filter. A workflow that never triggers emits no check
# run, and a required check that never reports blocks the PR forever with no
# error and no timeout. All path filtering happens INSIDE jobs.
on:
  pull_request:
    # `labeled`/`unlabeled` are what let the approvals gate clear when the label
    # is applied. Without them the check keeps its stale result and the only way
    # to green is an unrelated push.
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  merge_group:        # REQUIRED if a merge queue is ever enabled
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, and verified rather than assumed: nothing in this workflow
# uses the token -- no `gh`, no API call, no GITHUB_TOKEN reference. The write
# scope was standing over-grant inherited by every third-party action in the
# chain, and with it a compromised action could resolve review threads, which
# silently clears the ruleset's `required_review_thread_resolution` -- the one
# conversation gate a zero-approval solo-owner repo actually relies on.
permissions:
  contents: read
  pull-requests: read

env:
  PYTHONHASHSEED: "0"   # set/dict iteration order must not vary between runs
  FORCE_COLOR: "1"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            engine:
              - 'packages/engine/**'
              - 'tests/**'
              - 'data/**'
              - 'benchmarks/**'
              - 'pyproject.toml'
            web:
              - 'apps/web/**'

  python-quality:
    name: python-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv venv --python 3.11 .venv
      - run: uv pip install --python .venv/bin/python -e ".[dev,export]"
      - name: ruff lint
        run: .venv/bin/ruff check .
      - name: ruff format
        run: .venv/bin/ruff format --check .
      # CLAUDE.md 3.7 bans the global RNG, and this grep is its ONLY enforcement.
      # It used to name five numpy functions and `random.seed`, which left
      # np.random.uniform/normal/shuffle/permutation/random and every stdlib
      # `random.*` except seed passing silently. Now: any np.random attribute
      # EXCEPT the explicit-generator constructors, plus importing stdlib
      # `random` at all in engine source. Scope widened past src/ to the test
      # tree, because an unseeded draw in a strategy is just as irreproducible.
      - name: Ban global RNG state
        run: |
          # Match ANY np.random attribute call, then subtract the explicit-
          # generator constructors. Deliberately NOT a negative lookahead:
          # `grep -E` is POSIX ERE, where `(?!...)` is not a lookahead but a
          # warning and an exit status of 0 -- which in this `if` would fail
          # every build. Two greps, no lookahead.
          if grep -rnE --include='*.py' \
               '(^|[^.\w])(np|numpy)\.random\.[a-zA-Z_]+\(' packages/engine/src/ \
               | grep -vE 'default_rng|Generator|SeedSequence|PCG64'; then
            echo "::error::Use np.random.default_rng(seed); global RNG breaks reproducibility"
            exit 1
          fi
          if grep -rnE --include='*.py' '^\s*(import random|from random import)' \
               packages/engine/src/ tests/ packages/engine/tests/; then
            echo "::error::stdlib random is unseeded per-process; use np.random.default_rng(seed)"
            exit 1
          fi
      # Two of docs/PLAN.md's eight silent killers, both properties of the
      # workflow files: a path filter on a workflow owning a required check, and
      # a job missing from the gate's `needs`. Parser-based rather than grep --
      # the shell version this replaced passed `paths-ignore:`, flow-style
      # filters and a quoted `"on":` key, each of which deadlocks identically.
      - name: Guard the merge gate
        run: .venv/bin/python .github/scripts/check-workflow-gate.py
      # The mirror image of the step above. That one guards against a required check
      # that never reports and blocks a PR forever; this one against a hook whose
      # interpreter is missing, which does not block at all -- and is therefore worse,
      # because it is silent. A STEP, not a job: python-quality is already in
      # required-checks.needs with no `if:` gate, so this is blocking without touching
      # the ruleset, and a step cannot carry a `paths:` filter (CLAUDE.md section 9).
      - name: Guard the hook launchers
        run: .venv/bin/python .github/scripts/check-hook-commands.py

      # `main-broken`'s suppression predicate is embedded bash/jq that no pytest
      # can reach, and it decides whether a break on `main` is announced at all.
      # Its false-positive half already cost five bogus issues in ten minutes
      # (#136-#141). This drives the REAL jq program, extracted from this file,
      # over those five payloads, and checks the shell guard around it
      # structurally. `jq` is preinstalled on ubuntu runners; the script exits 2
      # rather than reporting a pass if it is ever absent.
      - name: Test the main-broken predicate
        run: .venv/bin/python .github/scripts/test-main-broken-predicate.py

  # mypy is configured `strict = true` in pyproject.toml and demanded by
  # CLAUDE.md section 8 and the PR template, and until now ran in NO CI job --
  # a self-declared checkbox was the only enforcement of a strict-mode type
  # contract on a codebase whose cross-lane seams are all Protocols.
  #
  # Installs the `fold` extra, unlike python-quality: structure/vienna.py
  # carries `# type: ignore[import-untyped]` on its `import RNA`, which does NOT
  # suppress `import-not-found` when the module is absent entirely.
  mypy:
    name: mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv venv --python 3.11 .venv
      - run: uv pip install --python .venv/bin/python -e ".[dev,export,fold]"
      - name: mypy --strict
        run: .venv/bin/mypy

  invariants:
    name: invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv venv --python 3.11 .venv
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Property-based invariants
        env: { HYPOTHESIS_PROFILE: ci }
        # No `-q`: it suppresses the run header, and the header is where the
        # Hypothesis budget is now printed. This job silently ran at a quarter
        # budget for months; the number being visible is what stops that
        # recurring. 50 tests, so the extra output is negligible.
        run: .venv/bin/pytest tests/invariants -p no:randomly

  contract:
    name: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv venv --python 3.11 .venv
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - name: Rule contract, honesty and oracle-independence gates
        run: .venv/bin/pytest tests/data_integrity -q

  # `core/` is frozen. Two halves, and neither can do the other's job.
  #
  # The pytest half proves the recorded manifest still describes the live code,
  # and that every recorded fixture still constructs. It runs everywhere.
  #
  # The check_amendment half classifies this branch's changes MINOR vs MAJOR
  # against MAIN's manifest, and demands an RFC for MAJOR. It can only run on a
  # pull request, because after you regenerate the manifest the local copy and
  # the live code agree by construction -- the severity of what you did is
  # visible only against the version you started from.
  contract-freeze:
    name: contract-freeze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history: the baseline is read out of main with `git show`, and a
        # shallow clone does not have it.
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv venv --python 3.11 .venv
      - run: uv pip install --python .venv/bin/python -e ".[dev]"
      - name: The recorded contract matches bt5.core, and fixtures still parse
        run: .venv/bin/pytest tests/contract -q
      - name: MAJOR contract changes carry an amendment
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          # Absent on the base branch until the freeze lands; an empty file is
          # the signal for "this commit IS the freeze", handled by the script.
          git show "origin/${GITHUB_BASE_REF}:tests/contract/manifest.json" \
            > /tmp/baseline.json 2>/dev/null || : > /tmp/baseline.json
          .venv/bin/python tests/contract/check_amendment.py /tmp/baseline.json

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv venv --python 3.11 .venv
      - run: uv pip install --python .venv/bin/python -e ".[dev,export,fold]"
      - run: .venv/bin/pytest packages/engine/tests -q -m "not slow"

  approvals:
    name: approvals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history: the diff is taken against the merge base, and a shallow
        # clone has no merge base to take it against.
        with: { fetch-depth: 0 }
      - name: Protected paths require their approval label
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Not a pull request; approval labels are a PR-time gate."
            exit 0
          fi
          git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > /tmp/changed.txt
          .github/scripts/check-approval-labels.sh /tmp/changed.txt "$LABELS"

  # ---- The post-merge safety net -------------------------------------------
  # A required status check gates PULL REQUESTS. It can do nothing about a
  # branch that has already been pushed, so until now a merge that broke main
  # produced a red check-run and then silence: no issue, no revert, and no gate
  # on the next merge landing on top of it. With `strict: false` in the ruleset
  # and several lanes open at once, the first symptom is every OPEN pull request
  # going red for a reason that has nothing to do with its own diff -- and the
  # failure gets attributed to whichever agent's PR happened to run into it.
  #
  # DELIBERATELY NOT in `required-checks.needs`, and listed in that script's
  # NON_BLOCKING set instead. It cannot be a gate dependency: it is skipped on
  # every pull_request event, and the gate counts `skipped` as failure, so
  # adding it to `needs` would block every PR permanently.
  #
  # `issues: write` is granted HERE and nowhere else. Job-level permissions
  # replace the workflow-level block outright, so this scope reaches this job
  # only -- no other job, and no third-party action in any other job, inherits it.
  main-broken:
    name: main-broken
    if: >-
      always() && github.event_name == 'push' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    #
    # `mypy` belongs in this list for the same reason it belongs in
    # `required-checks.needs`: it is a required gate. It was added to the gate
    # and not to the safety net, so a strict-mode type break landing on main
    # went red on the push and then silent -- no issue, and the next merge
    # landing on top of it gated on nothing.
    needs:
      [
        changes,
        python-quality,
        mypy,
        invariants,
        contract,
        contract-freeze,
        python-tests,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open one issue per broken commit
        env:
          GH_TOKEN: ${{ github.token }}
          # This job does no checkout -- it has nothing to build -- so `gh` has
          # no local repo to infer from and must be told which one it is acting on.
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULTS: ${{ toJSON(needs) }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # A SUPERSEDED run is not a broken commit. `cancelled` is in this job's
          # `if:` because a cancellation can hide a real break -- but the dominant
          # cause by far is `cancel-in-progress` killing the still-running checks
          # for commit N when commit N+1 lands on top of it. Merging six pull
          # requests in ten minutes filed five "main is red" issues that way
          # (#136, #137, #138, #140, #141), every one of them naming an
          # intermediate commit whose tests were never allowed to finish, and
          # every one of them false. An alarm that cries wolf five times in ten
          # minutes is worse than no alarm, because the next real break lands in
          # the noise.
          #
          # So suppress ONLY when BOTH hold: nothing actually failed, and this
          # commit is no longer the branch tip. A real `failure` still files
          # whatever the tip is, and a cancellation AT the tip still files --
          # that is the case where something may genuinely be wrong and no later
          # run will cover it. A break at an intermediate commit that is real is
          # inherited by the tip and reported there instead.
          if ! printf '%s' "$RESULTS" | jq -e 'any(.[]; .result == "failure")' >/dev/null; then
            TIP="$(gh api "repos/$GH_REPO/commits/$BRANCH" --jq .sha 2>/dev/null || true)"
            if [ -n "${TIP:-}" ] && [ "$TIP" != "$SHA" ]; then
              echo "No job failed -- only cancellations -- and $SHA is no longer the"
              echo "tip of $BRANCH (now $TIP). This run was superseded; not filing."
              exit 0
            fi
          fi

          TITLE="main is red at ${SHA:0:9}"
          # One issue per commit, not one per re-run. `--search` is scoped to
          # open issues so a closed one does not suppress a fresh break on a
          # later commit that happens to share the prefix.
          EXISTING="$(gh issue list --state open --search "in:title \"$TITLE\"" \
                        --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "already tracked in #$EXISTING"
            exit 0
          fi
          # No --label: the repository has no label set for this, and
          # `gh issue create --label` FAILS on an unknown label rather than
          # warning -- which would break the safety net at the one moment it is
          # needed. Add one here if a suitable label is ever created.
          gh issue create --title "$TITLE" --body "$(cat <<EOF
          CI failed on \`main\` at [\`${SHA:0:9}\`](${{ github.server_url }}/${{ github.repository }}/commit/$SHA).

          **Run:** $RUN_URL

          Every open pull request will now go red against this base, for reasons
          unrelated to its own diff. Fix forward or revert before merging anything
          else -- the merge gate protects pull requests and cannot protect a branch
          that has already been pushed.

          Job results:

          \`\`\`json
          $RESULTS
          \`\`\`

          _Opened automatically by the \`main-broken\` job in ci.yml._
          EOF
          )"

  # ---- The ONLY check named in the ruleset ---------------------------------
  # `if: always()` plus an explicit needs.*.result inspection. Without the
  # inspection the gate reports success while everything under it burns; with
  # `if: success()` the gate is SKIPPED when a dependency fails, and a skipped
  # required check SATISFIES the requirement, so failing tests would merge.
  required-checks:
    name: required-checks
    if: always()
    needs:
      [
        changes,
        python-quality,
        mypy,
        invariants,
        contract,
        contract-freeze,
        python-tests,
        approvals,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "::error::One or more required jobs did not succeed"
          echo '${{ toJSON(needs) }}'
          exit 1
