# pre-pr-attest -- did /pre-pr actually run against the commit being merged?
#
# ADVISORY ON PURPOSE. This job is deliberately NOT a required check yet: it is
# absent from `.github/rulesets/main-protection.json` and absent from
# `required-checks.needs` in ci.yml. That is a decision, not an oversight.
#
#   To promote it, add ONE entry to main-protection.json:
#       { "context": "pre-pr-attest", "integration_id": 15368 }
#   and nothing else. It is a PARALLEL required context, never an input to
#   `required-checks` -- that gate counts `skipped` as failure (ci.yml, job
#   `required-checks`), which is why `main-broken` is excluded from it too.
#   The `rearm` job below is already in check-workflow-gate.py's NON_BLOCKING
#   set, which is what keeps that one line one line.
#   Precondition: a week of clean runs with the re-arm behaviour confirmed on a
#   real push -- and note that until this commit there WAS no working re-arm, so
#   no run before it counts towards that week.
#
# WHY THIS EXISTS. `/pre-pr` runs code-reviewer, rule-auditor and
# security-reviewer as subagents inside one Claude session. Their verdicts live
# in that session's transcript, so they are invisible to GitHub and to every
# other session -- and `.claude/.pre-pr-marker` is gitignored (.gitignore:19) and
# digests `git status` + `git diff HEAD`, which are empty and constant on a clean
# CI checkout. So the local marker cannot be the evidence. A comment naming the
# head SHA can be.
#
# WHAT IT PROVES, AND WHAT IT DOES NOT. It proves a claim was made on the
# record, against a specific SHA, where the owner and every session can see it.
# It does NOT prove the review was done honestly -- Claude posts the comment.
# The gain is that SKIPPING BECOMES VISIBLE, which the local hook never achieved:
# PR #79 merged as 628e130 with /pre-pr never having run and nothing said so.
#
# `/pre-pr` and `/pre-pr-bypass` are separate commands on purpose. Both come from
# the owner's account, so the author cannot distinguish them -- the command can,
# and the PR timeline then records which one happened.

name: pre-pr-attest

# `pull_request_target` runs THIS FILE FROM THE BASE BRANCH, so a pull request
# cannot edit the check to make itself pass. There is deliberately no checkout
# step: this job never executes PR code.
#
# TWO EVENTS, TWO JOBS, AND ONLY ONE OF THEM IS ALLOWED TO REPORT.
# A check run attaches to the commit of the workflow run that produced it, and
# an `issue_comment` run is a DEFAULT-BRANCH run -- so its check lands on main's
# tip and the pull request never sees it. One job answering both events
# therefore made the re-arm a no-op that LOOKED like it worked: the attestation
# turned `pre-pr-attest` green on `main`, while the pull request kept the red
# check it was opened with and had no way to clear it. #92, #94, #97, #89 and
# #101 all merged with this check red for that reason and no other. So:
#
#   pull_request_target -> `pre-pr-attest`, which owns the check on the HEAD SHA
#                          and is the only job here that reports a verdict.
#   issue_comment       -> `rearm`, which reports no VERDICT and instead waits
#                          for that run to land and re-runs it if it is not
#                          green, so it re-reads the comments.
#
# WHAT THIS STILL DOES NOT PREVENT, so nobody mistakes it for more than it is:
#   * `author_association` is resolved when the comment list is READ, not when
#     the comment was posted. Adding someone as a collaborator retroactively
#     promotes every `/pre-pr <sha>` they ever wrote.
#   * Only `issue_comment: [created]` is subscribed, but bodies are re-read
#     live, so a counted author can EDIT an old comment into an attestation
#     with no new timeline entry. They could equally post a fresh one, so this
#     costs auditability rather than access.
#   * The verdict is computed against a head fetched live at step time, while
#     the check run is bound to the head fixed at event time. Two pushes inside
#     the concurrency window can decouple them (see the API-read note below).
#
# No `paths:`/`paths-ignore:` filter, ever -- check-workflow-gate.py rejects one
# on any workflow, because a required check that never reports blocks the pull
# request forever with no error (CLAUDE.md section 9).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  # Keyed on the EVENT as well as the pull request. Under one shared group
  # `cancel-in-progress` let an attestation comment cancel the very
  # pull_request_target run it was posted to re-arm -- and a cancelled check run
  # is red on the head SHA with no verdict inside it to explain why.
  group: pre-pr-attest-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  pull-requests: read

jobs:
  pre-pr-attest:
    name: pre-pr-attest
    # `pull_request_target` ONLY -- the one event whose check run lands on the
    # commit the pull request would merge. It fires on every such event and
    # always reports, which is what makes it safe to promote to a required
    # context later. Comments are handled by `rearm` below, which deliberately
    # produces no check of its own.
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: An attestation must name the CURRENT head SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # Read the head from the API rather than the event payload. A re-run
          # replays the ORIGINAL payload, and a re-run is exactly how `rearm`
          # works -- so the payload's head can be stale by the time it is read,
          # and an attestation for a superseded commit must not satisfy this.
          HEAD_SHA="$(gh api "repos/$REPO/pulls/$PR" --jq '.head.sha')"
          echo "pull request #$PR, current head $HEAD_SHA"

          # `--paginate` emits one array per page; re-slurp into a single array.
          gh api --paginate "repos/$REPO/issues/$PR/comments" --jq '.[]' \
            | jq -s '.' > /tmp/comments.json
          echo "$(jq 'length' /tmp/comments.json) comment(s) on this pull request"

          # A drive-by commenter must not be able to attest for someone else's
          # branch, so the author must be OWNER, COLLABORATOR or MEMBER. Note
          # what that does and does not mean: `author_association` is NOT a
          # permission check. COLLABORATOR covers read-only and triage
          # collaborators too, and MEMBER means "in the owning organisation",
          # which for a personal repository is unreachable but would widen the
          # set on a transfer to an org. Today the repository has exactly one
          # collaborator, the owner, at `admin`.
          #
          # The SHA must be the full 40 characters: a short SHA would let an
          # attestation for one commit satisfy another that shares its prefix.
          #
          # The trailing class must include \r and \n. A comment almost always
          # has prose around the command, so requiring space-tab-or-end-of-string
          # after the SHA silently failed to match every attestation that was not
          # the entire comment body -- caught by the fixture test below.
          #
          # NO LEADING WHITESPACE, and that is load-bearing rather than tidy.
          # This used to allow `[ \t]*` before the command, which made THIS JOB'S
          # OWN FAILURE MESSAGE a valid attestation: the help text below prints
          # `    /pre-pr <head-sha>` indented four spaces, so a maintainer who
          # pasted the log into a comment to ask about it silently turned the
          # check green with no review having happened -- defeating the one
          # property this file claims ("SKIPPING BECOMES VISIBLE"). Anchoring to
          # the line start rejects the paste, and rejects a `>` quote-reply too,
          # while the help text stays indented so it cannot match either way.
          claims() {
            jq -r --arg sha "$HEAD_SHA" --arg cmd "$1" --argjson who "$2" '
              [ .[]
                | select(.author_association as $a | $who | index($a))
                | .body
                | select(test("(^|\\r?\\n)" + $cmd + "[ \\t]+" + $sha + "([ \\t\\r\\n]|$)"))
              ] | length' /tmp/comments.json
          }

          ATTESTED="$(claims '/pre-pr' '["OWNER","COLLABORATOR","MEMBER"]')"
          BYPASSED="$(claims '/pre-pr-bypass' '["OWNER"]')"

          if [ "$ATTESTED" != "0" ]; then
            echo "OK: /pre-pr was attested for $HEAD_SHA"
            exit 0
          fi

          if [ "$BYPASSED" != "0" ]; then
            echo "OK: the owner bypassed /pre-pr for $HEAD_SHA"
            echo "::warning::/pre-pr did not run on this head; the owner waived it deliberately"
            exit 0
          fi

          echo "::error::No /pre-pr attestation for the current head $HEAD_SHA"
          cat <<EOF

          /pre-pr has not been attested for the commit this pull request would
          merge. Run /pre-pr, then comment exactly:

              /pre-pr $HEAD_SHA

          An attestation names one commit. Pushing again makes it stale on
          purpose -- a review of the previous tree says nothing about this one.

          To merge without the review pass, the repository owner may comment:

              /pre-pr-bypass $HEAD_SHA

          which records the waiver on the timeline instead of hiding it.
          EOF
          exit 1

  # ---- Re-arming: the half that was missing --------------------------------
  # Reports no VERDICT, on purpose. It exists only to make the job above
  # re-evaluate, because nothing an issue_comment run does can land a check on
  # the pull request's head SHA. Reporting a verdict from here would put a
  # second, rival `pre-pr-attest` on a commit that is not the one being merged
  # -- which is the bug this job replaces, not a fix for it.
  #
  # It is NOT check-run-free, and an earlier draft of this comment claimed it
  # was. Every job emits a check run named by its `name:`, so this one puts a
  # check called `rearm` on the default branch's tip -- which is itself a check
  # reporting on a commit it was not evaluated against. Harmless because the
  # name cannot be confused with `pre-pr-attest`, it gates nothing, and it is in
  # NON_BLOCKING. It goes red on `main` if `gh run rerun` exits non-zero, e.g.
  # a run outside the retention window.
  #
  # Deliberately outside any merge gate, and named in check-workflow-gate.py's
  # NON_BLOCKING set, so that promoting `pre-pr-attest` to a required context
  # stays the single ruleset line this file's header promises it is.
  rearm:
    name: rearm
    # This repository is PUBLIC, so any account can comment, and `actions: write`
    # in a drive-by's hands would be a re-run button on someone else's branch.
    # The association is therefore filtered here as well -- belt and braces, since
    # the re-run itself re-checks it and counts only OWNER/COLLABORATOR/MEMBER.
    # The comment body reaches `contains()` and nothing else: it is never
    # interpolated into a shell command, an argument, or a jq program.
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/pre-pr') &&
      contains(fromJSON('["OWNER","COLLABORATOR","MEMBER"]'),
      github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level block REPLACES the workflow-level one outright rather than
    # merging with it, so every scope absent here is `none` -- including
    # `contents`, which is why this job could not check out even if it tried.
    # Re-declaring `pull-requests: read` is therefore load-bearing, not
    # redundant: drop it and it becomes `none`.
    permissions:
      pull-requests: read
      # All this job CALLS is `gh run rerun`, but the SCOPE is wider than that:
      # `actions: write` also permits deleting workflow runs and their logs --
      # the evidence trail this file exists to produce -- and approving pending
      # fork-PR runs. Not reachable here (the guard below runs before any step,
      # this job checks out nothing and uses no third-party action), but the
      # grant is the thing to reason about, not the script.
      actions: write
    steps:
      - name: Re-run the attestation against this pull request's head
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          HEAD_SHA="$(gh api "repos/$GH_REPO/pulls/$PR" --jq '.head.sha')"
          echo "pull request #$PR, current head $HEAD_SHA"

          # The newest pull_request_target run for this exact head, whatever its
          # status. Scoped by head_sha rather than by branch: a run against a
          # superseded commit is stale by design, and re-running it would prove
          # nothing.
          #
          # WAIT FOR IT TO LAND rather than skipping an in-flight run. The
          # attesting party pushes and then comments seconds later, so the run
          # this needs is usually still executing -- and the first cut of this
          # job exited 0 on exactly that state, which left the check red with
          # nothing on the way to clear it. Harmless when a human is driving
          # (comment again), unrecoverable when an agent is: nothing re-comments.
          #
          # An in-flight run may also go green by itself. It reads the comment
          # list at step time, so if the attestation beat it to the API there is
          # nothing to re-arm -- which is why this polls for the CONCLUSION
          # instead of unconditionally re-running.
          DEADLINE=$((SECONDS + 180))
          while :; do
            RUN_JSON="$(gh api \
              "repos/$GH_REPO/actions/workflows/pre-pr-attest.yml/runs?event=pull_request_target&head_sha=$HEAD_SHA&per_page=100" \
              --jq '[.workflow_runs[]] | sort_by(.run_number, .id) | last // {}')"
            RUN="$(printf '%s' "$RUN_JSON" | jq -r '.id // empty')"
            STATUS="$(printf '%s' "$RUN_JSON" | jq -r '.status // empty')"
            CONCLUSION="$(printf '%s' "$RUN_JSON" | jq -r '.conclusion // empty')"

            if [ -z "$RUN" ]; then
              # The head moved after the comment was posted, so the attestation
              # is stale exactly as intended. Not a failure.
              echo "::notice::No pull_request_target run for $HEAD_SHA; nothing to re-arm."
              exit 0
            fi

            [ "$STATUS" = "completed" ] && break

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              # Bounded so this job cannot outlive its own timeout-minutes. The
              # attest job is one ~10s API step, so 180s means something is
              # wrong upstream, not that it needs longer.
              echo "::warning::run $RUN still $STATUS after 180s; not re-arming. Comment again to retry."
              exit 0
            fi
            echo "run $RUN is $STATUS; waiting for it to land"
            sleep 15
          done

          if [ "$CONCLUSION" = "success" ]; then
            echo "run $RUN is already green for $HEAD_SHA; nothing to re-arm"
            exit 0
          fi

          echo "re-running $RUN ($CONCLUSION) so it re-reads the comments on #$PR"
          gh run rerun "$RUN"
