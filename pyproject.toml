[project]
name = "bt5"
version = "0.1.0"
description = "Codon optimization and protein back-translation, evaluated on the assembled construct"
requires-python = ">=3.11"

# EVERY runtime dependency is declared here in PR #0. No lane adds one.
# uv.lock is the least-mergeable file in the repo; see CLAUDE.md section 5.
dependencies = [
    "numpy>=1.26",
    "biopython>=1.83",
    "pyahocorasick>=2.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
bt5 = "bt5.cli:main"

[project.optional-dependencies]
# Folding. ViennaRNA is the BUNDLED DEFAULT (owner holds bundling permission).
# Pinned exactly: energy parameters determine every dG, so an unannounced version
# change silently shifts every benchmark baseline. See docs/PLAN.md "ViennaRNA version policy".
fold = ["viennarna==2.7.2"]

# Biosecurity. The biorisk-only tier is <1 GB and ships ON BY DEFAULT.
# The full protein/nucleotide similarity tier needs ~600 GB and is explicit opt-in.
#
# COMMENTED OUT, NOT DELETED (#106). `commec` is real, active and MIT-licensed --
# ibbis-bio/common-mechanism, currently v2.1.0 -- but it is not published on PyPI,
# and `pypi.org/pypi/commec/json` is a 404. uv resolves the WHOLE project, every
# extra whether or not you asked for it, so an unresolvable extra made `uv run`,
# `uv sync` and `uv lock` all fail in the repo root. CI never noticed: every job
# installs named extras with `uv pip install -e ".[dev,...]"`, which never visits
# `screen`, and no `uv.lock` is checked in.
#
# Nothing imports `commec` today -- screening is unimplemented -- so the extra
# bought nothing and cost every ad-hoc `uv` invocation. Left in place as a comment
# rather than deleted so the intent stays visible and re-adding it is a reviewable
# one-line change rather than an archaeology exercise.
#
# The VCS form below is verified to resolve (`uv lock` on a minimal probe:
# "Resolved 4 packages in 936ms", exit 0), and is the shape to restore when the
# screen lane is actually built:
#
#     screen = ["commec @ git+https://github.com/ibbis-bio/common-mechanism@v2.1.0"]
#
# Not adopted NOW because it resolves without working: upstream declares no
# `dependencies` key at all ("This is not a pure python project; dependencies are
# managed through environment.yml"), so a pip/uv install yields the Python package
# with none of its HMMER/BLAST binaries. Pinning a tag today also pins one that
# will be stale by the time the lane exists, which is when the conda/binary story
# has to be solved anyway.
#
# screen = ["commec>=0.2"]

server = ["fastapi>=0.110", "uvicorn>=0.29", "sse-starlette>=2.0"]
export = ["openpyxl>=3.1"]

dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-xdist",
    "hypothesis>=6.100",
    "syrupy>=4",
    "ruff>=0.4",
    "mypy>=1.10",
]

# Nightly differential oracle only. NOT used in the engine.
diff = ["dnachisel>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/engine/src/bt5"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages/engine/tests"]
markers = [
    "slow: excluded from PR runs; nightly only",
    "differential: requires the `diff` extra",
]
# Biopython's Seq.translate() SILENTLY TRUNCATES a non-multiple-of-3 sequence,
# emitting only a BiopythonWarning. A frame-length bug would pass a naive
# round-trip test. Promote it to an error.
filterwarnings = ["error::Bio.BiopythonWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "PGH"]
# PGH003/PGH004 (blanket type: ignore / noqa) stay enabled deliberately -- a
# blanket suppression is how a real defect gets hidden from review.

[tool.ruff.lint.per-file-ignores]
# InfeasibleConstraints is domain vocabulary and reads correctly at call sites;
# renaming it to InfeasibleConstraintsError would be worse.
"packages/engine/src/bt5/core/result.py" = ["N818"]
"tests/**" = ["PT018"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["packages/engine/src/bt5"]

[tool.coverage.report]
fail_under = 85
